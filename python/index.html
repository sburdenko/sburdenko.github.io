<script>
(function () {
  var shown = false;
  function report(what) {
    if (shown) return;
    shown = true;
    var box = document.createElement('div');
    box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;padding:12px 16px;background:#ff5c6c;color:#1a0009;font:600 13px/1.5 ui-monospace,Menlo,Consolas,monospace';
    box.textContent = 'Scripts failed to load — press Cmd/Ctrl + Shift + R to hard-reload. Скрипты не загрузились — обнови страницу с Cmd/Ctrl + Shift + R. [' + what + ']';
    (document.body || document.documentElement).appendChild(box);
  }
  addEventListener('error', function (e) { var el = e.target; if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) report(el.src || el.href); else report(e.message || 'script error'); }, true);
  addEventListener('unhandledrejection', function (e) { report(String((e.reason && e.reason.message) || e.reason)); });
})();
</script>
